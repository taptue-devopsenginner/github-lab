name: ci

on:
  push:

jobs:
  setup:
    runs-on: self-hosted
    steps:
      - name: Check Docker version
        run: docker --version || sudo docker --version

      - name: Show user info
        run: id

  configure:
    needs: setup
    runs-on: self-hosted
    steps:
      - name: Add ubuntu to docker group
        run: sudo usermod -aG docker ubuntu

      - name: Verify groups
        run: groups ubuntu

  verify:
    needs: configure
    runs-on: self-hosted
    steps:
      - name: Check Docker access
        run: docker ps || echo "Docker requires logout/login"

          
          
